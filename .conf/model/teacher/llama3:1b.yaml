hf_model:
  _target_: "transformers.AutoModelForCausalLM.from_pretrained"
  pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B-Instruct"  
  device_map: "auto" 
  dtype: "bfloat16"

top_k: 2
prompt_template: |
  You are a medical QA assistant. Use the provided context from PubMed to answer.
  Question: {question}
  Context:
  {context}
  Answer concisely and cite evidence succinctly if helpful.
