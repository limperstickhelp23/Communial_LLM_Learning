epochs: 5
batch_size: 8
max_gen_tokens: 128
# warmup_ratio: 0.05

accelerator: # Hugging facde Accelerate config
  _target_: "accelerate.Accelerator"

loss:
  lambda_contrast: 0.4
  temperature: 0.07

optim:
  type: "adamw"
  lr: 2e-4
  weight_decay: 0.01

  

logging:
  eval_every_steps: 3
  save_every_steps: 2
  out_dir: "checkpoints/watson"
  save_dir: "checkpoints/watson/model"

eval:
  metrics: ["acc_ynm", "bleu", "rougeL"]
